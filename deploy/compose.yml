---
services:
  server:
    image: >-
      ${FRP_IMAGE:-sgccr.ccs.tencentyun.com/frp-all-in-one/frp-server:latest}
    container_name: frp-server
    restart: always
    network_mode: host
    env_file: .env
    volumes:
      - ./data:/app/data
      # Optional: docker.sock grants host-admin privileges.
      # Prefer host-side upgrades.
      # - /var/run/docker.sock:/var/run/docker.sock
    labels:
      # 外部自动重建会绕过事务锁、健康验证和回滚，请使用面板或 upgrade.sh。
      - "com.centurylinklabs.watchtower.enable=false"
