# ============================================================
# FRP Manager Agent - GitHub Actions 自动编译发布
# ============================================================
# 触发条件：
#   1. 手动触发 (workflow_dispatch) — 可指定版本号
#   2. 推送到 main 分支时，agent/ 目录文件变动自动触发
#
# 产出：
#   - frp-agent-linux-amd64
#   - frp-agent-linux-arm64
#   - frp-agent-darwin-amd64
#   - frp-agent-darwin-arm64
#   - frp-agent-windows-amd64.exe
# ============================================================

name: Build and Release Agent

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (如 v3.2.3)'
        required: true
        default: 'v3.2.3'

  push:
    branches:
      - main
    paths:
      - 'agent/cmd/**'
      - 'agent/internal/**'
      - 'agent/go.mod'
      - 'agent/go.sum'
      - 'core/**'
    tags:
      - 'v*'

env:
  GO_VERSION: '1.26'

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo ">> Version: ${VERSION}"

  build:
    name: Build Agent Binaries
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: agent/go.sum

      - name: Run tests
        working-directory: ./agent
        run: set -euo pipefail && go test ./...

      - name: Build binaries
        working-directory: ./agent
        run: |
          set -euo pipefail
          VERSION=${{ needs.resolve-version.outputs.VERSION }}
          BT=$(date +%Y-%m-%d_%H:%M:%S)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.buildTime=${BT}"
          mkdir -p dist

          TARGETS=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
          )
          for TARGET in "${TARGETS[@]}"; do
            set -- $TARGET
            OS=$1; ARCH=$2
            EXT=""; [ "$OS" = "windows" ] && EXT=".exe"
            OUT="dist/frp-agent-${OS}-${ARCH}${EXT}"
            echo "Building ${OS}-${ARCH}..."
            CGO_ENABLED=0 GOOS=$OS GOARCH=$ARCH go build \
              -trimpath -buildvcs=false \
              -ldflags "$LDFLAGS" \
              -o "$OUT" ./cmd/frp-agent
          done

          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-binaries
          path: agent/dist/
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: agent-binaries
          path: dist/

      - name: Generate checksums
        run: set -euo pipefail && cd dist && sha256sum frp-agent-* > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          name: FRP Manager Agent ${{ needs.resolve-version.outputs.VERSION }}
          body: |
            ## FRP Manager Agent ${{ needs.resolve-version.outputs.VERSION }}

            | 文件 | 平台 |
            |------|------|
            | `frp-agent-linux-amd64` | Linux x64 |
            | `frp-agent-linux-arm64` | Linux ARM64 |
            | `frp-agent-darwin-amd64` | macOS Intel |
            | `frp-agent-darwin-arm64` | macOS Apple Silicon |
            | `frp-agent-windows-amd64.exe` | Windows x64 |
          files: |
            dist/frp-agent-linux-amd64
            dist/frp-agent-linux-arm64
            dist/frp-agent-darwin-amd64
            dist/frp-agent-darwin-arm64
            dist/frp-agent-windows-amd64.exe
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
