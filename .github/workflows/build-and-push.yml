# ============================================================
# FRP-ALL-IN-ONE - 构建并推送 Docker 镜像到腾讯云 TCR
# ============================================================
# 架构：
#   - 服务端全合一镜像: frp-server (Web 控制台 + 管理 API + 内置 FRPS 核心)
#   - 客户端镜像: frp-agent (内置 FRP 穿透客户端)
#
# 所需 GitHub Secrets:
#   TCR_USERNAME  — 腾讯云 TCR 访问凭证用户名
#   TCR_PASSWORD  — 腾讯云 TCR 访问凭证密码
# ============================================================

name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签 (如 v3.1.1 或 latest)'
        required: false
        default: 'latest'

  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'frontend/**'
      - 'agent/**'
      - 'core/**'
      - 'deploy/**'
      - '.github/workflows/build-and-push.yml'
    tags:
      - 'v*'

permissions:
  contents: read

env:
  REGISTRY: sgccr.ccs.tencentyun.com
  NAMESPACE: frp-all-in-one
  SERVER_IMAGE: sgccr.ccs.tencentyun.com/frp-all-in-one/frp-server
  AGENT_IMAGE: sgccr.ccs.tencentyun.com/frp-all-in-one/frp-agent

jobs:
  # ===========================
  # 检测变更范围，决定构建哪些镜像
  # ===========================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.changes.outputs.server }}
      agent: ${{ steps.changes.outputs.agent }}
      tag: ${{ steps.tag.outputs.TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check deployment shell syntax
        run: |
          for script in deploy/*.sh; do
            bash -n "$script"
          done

      - name: Check Windows uninstall syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $path = Join-Path $env:GITHUB_WORKSPACE 'deploy/uninstall-client.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path, [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Detect file changes
        id: changes
        run: |
          event="$GITHUB_EVENT_NAME"
          ref_type="$GITHUB_REF_TYPE"
          if [ "$event" = "workflow_dispatch" ] || [ "$ref_type" = "tag" ]; then
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "agent=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SERVER_CHANGED="false"
          AGENT_CHANGED="false"

          for file in $(git diff --name-only HEAD~1 HEAD 2>/dev/null); do
            case "$file" in
              server/*|frontend/*|core/*|deploy/*|\
              .github/workflows/build-and-push.yml)
                SERVER_CHANGED="true" ;;
              agent/cmd/*|agent/internal/*|agent/go.mod|agent/go.sum|\
              agent/Dockerfile)
                AGENT_CHANGED="true" ;;
            esac
          done

          echo "server=${SERVER_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "agent=${AGENT_CHANGED}" >> "$GITHUB_OUTPUT"
          echo ">> Changes: s=${SERVER_CHANGED}, a=${AGENT_CHANGED}"

      - name: Determine tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG:-latest}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="latest"
          fi
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid container image tag"
            exit 1
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo ">> Image tag: ${TAG}"

  # ===========================
  # 构建并推送全合一服务端镜像
  # ===========================
  build-server:
    name: Build Server Image (frp-server)
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ needs.detect-changes.outputs.tag }}
            ${{ env.SERVER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================
  # 构建并推送客户端 Agent 镜像
  # ===========================
  build-agent:
    name: Build Agent Image (frp-agent)
    needs: detect-changes
    if: needs.detect-changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push Agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          push: true
          tags: |
            ${{ env.AGENT_IMAGE }}:${{ needs.detect-changes.outputs.tag }}
            ${{ env.AGENT_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================
  # 验证镜像公开匿名可拉取性
  # ===========================
  verify-public-images:
    name: Verify Public Image (${{ matrix.image }})
    needs:
      - detect-changes
      - build-server
      - build-agent
    if: >-
      ${{ always() && !cancelled() &&
          needs.detect-changes.result == 'success' &&
          !contains(needs.*.result, 'failure') &&
          !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [frp-server, frp-agent]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull images without registry credentials
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAG: ${{ needs.detect-changes.outputs.tag }}
        run: |
          image="$REGISTRY/$NAMESPACE/$IMAGE_NAME"
          images=("$image:$IMAGE_TAG")
          if [ "$IMAGE_TAG" != "latest" ]; then
            images+=("$image:latest")
          fi
          bash deploy/check-public-images.sh "${images[@]}"
          {
            printf '### Anonymous pull verified\n'
            printf -- '- %s\n' "${images[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
