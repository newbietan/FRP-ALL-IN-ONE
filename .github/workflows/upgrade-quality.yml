name: Upgrade regression tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - 'agent/**'
      - 'core/**'
      - 'deploy/**'
      - '.github/workflows/upgrade-quality.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'agent/**'
      - 'core/**'
      - 'deploy/**'
      - '.github/workflows/upgrade-quality.yml'

permissions:
  contents: read

jobs:
  upgrade-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: agent/go.sum
      - name: Install test dependencies
        run: >-
          python -m pip install -r server/requirements.txt
          pytest pytest-asyncio
      - name: Test backend and generated scripts
        run: PYTHONPATH=server python -m pytest -q server/tests
      - name: Test Agent with race detector
        working-directory: agent
        run: go test -race -count=1 -timeout=120s ./...
      - name: Test real Docker upgrade and rollback on isolated runner
        run: |
          sudo -E env "PATH=$PATH" PYTHONPATH=server FRP_DOCKER_INTEGRATION=1 \
            "$(command -v python)" -m pytest -q \
            server/tests/test_docker_upgrade_integration.py
