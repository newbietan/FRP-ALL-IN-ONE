<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080a0"/>
      <stop offset="45%" stop-color="#006782"/>
      <stop offset="100%" stop-color="#003e4f"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#00add8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#004356" stop-opacity="0.7"/>
